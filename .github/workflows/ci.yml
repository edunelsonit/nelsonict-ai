name: Application checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q app tests
      - run: node --check app/static/app.js
      - run: python -m pytest -q
      - name: Check Compose configuration
        run: cp .env.example .env && docker compose config --quiet
      - name: Record tested dependency versions
        run: pip freeze > tested-requirements.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tested-dependencies
          path: tested-requirements.txt
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Build CPU deployment image
        run: docker build -t nelsonict-ai:check .
      - name: Verify native inference and OCR imports
        run: docker run --rm nelsonict-ai:check python -c "import llama_cpp,pypdfium2,pytesseract; print('Native dependencies import successfully')"
      - name: Verify web startup
        run: |
          docker run -d --name nelsonict-check -p 8000:8000 nelsonict-ai:check
          for attempt in $(seq 1 30); do
            if curl --fail http://127.0.0.1:8000/api/health; then exit 0; fi
            sleep 2
          done
          docker logs nelsonict-check
          exit 1
